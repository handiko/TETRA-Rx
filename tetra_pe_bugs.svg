<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="The bug hunt: what was wrong with the first voice version, and how each problem was fixed">
<title>The bug hunt: what was wrong with the first voice version, and how each problem was fixed</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="22.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">The bug hunt, in the order I found things</text>
<rect x="30.0" y="52.0" width="510.0" height="124.0" rx="10" fill="#ffffff" stroke="#c9c9c4" stroke-width="1.2"/>
<circle cx="56.0" cy="78.0" r="15.0" fill="#A32D2D" stroke="#A32D2D" stroke-width="1.2"/>
<text x="56.0" y="78.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text x="82.0" y="78.0" font-size="13" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Voice decoder fed the wrong bursts</text>
<text x="50.0" y="104.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="112.0" y="104.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">It listened to NTS2 (half slots = signalling). Speech uses NTS1.</text>
<rect x="44.0" y="134.0" width="482.0" height="32.0" rx="6" fill="#E7F6EC" stroke="#15803d" stroke-width="1.0"/>
<text x="56.0" y="150.0" font-size="10" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="86.0" y="150.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="start" dominant-baseline="central">Added a third correlator on NTS1 with its own cutter.</text>
<rect x="560.0" y="52.0" width="510.0" height="124.0" rx="10" fill="#ffffff" stroke="#c9c9c4" stroke-width="1.2"/>
<circle cx="586.0" cy="78.0" r="15.0" fill="#A32D2D" stroke="#A32D2D" stroke-width="1.2"/>
<text x="586.0" y="78.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<text x="612.0" y="78.0" font-size="13" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Two cutters, one burst</text>
<text x="580.0" y="104.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="642.0" y="104.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Block 1 and block 2 came from two blocks in two threads and had to be</text>
<text x="642.0" y="119.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">paired.</text>
<rect x="574.0" y="134.0" width="482.0" height="32.0" rx="6" fill="#E7F6EC" stroke="#15803d" stroke-width="1.0"/>
<text x="586.0" y="150.0" font-size="10" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="616.0" y="150.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="start" dominant-baseline="central">One Tags To PDU cuts all 484 bits; Python slices them.</text>
<rect x="30.0" y="192.0" width="510.0" height="124.0" rx="10" fill="#ffffff" stroke="#c9c9c4" stroke-width="1.2"/>
<circle cx="56.0" cy="218.0" r="15.0" fill="#A32D2D" stroke="#A32D2D" stroke-width="1.2"/>
<text x="56.0" y="218.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text x="82.0" y="218.0" font-size="13" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">The timeslot filter stopped the block</text>
<text x="50.0" y="244.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="112.0" y="244.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">pmt objects have no .to_long(): AttributeError on the very first burst.</text>
<rect x="44.0" y="274.0" width="482.0" height="32.0" rx="6" fill="#E7F6EC" stroke="#15803d" stroke-width="1.0"/>
<text x="56.0" y="290.0" font-size="10" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="86.0" y="290.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="start" dominant-baseline="central">Use pmt.to_long(). Confirmed on a real GNU Radio 3.10 install.</text>
<rect x="560.0" y="192.0" width="510.0" height="124.0" rx="10" fill="#ffffff" stroke="#c9c9c4" stroke-width="1.2"/>
<circle cx="586.0" cy="218.0" r="15.0" fill="#A32D2D" stroke="#A32D2D" stroke-width="1.2"/>
<text x="586.0" y="218.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text x="612.0" y="218.0" font-size="13" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">There was no timeslot to filter on</text>
<text x="580.0" y="244.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="642.0" y="244.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Nothing in the graph ever produced a "timeslot" value. The filter let</text>
<text x="642.0" y="259.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">everything through.</text>
<rect x="574.0" y="274.0" width="482.0" height="32.0" rx="6" fill="#E7F6EC" stroke="#15803d" stroke-width="1.0"/>
<text x="586.0" y="290.0" font-size="10" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="616.0" y="290.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="start" dominant-baseline="central">Bit positions from rx_time + a SYNC reference (previous picture).</text>
<rect x="30.0" y="332.0" width="510.0" height="124.0" rx="10" fill="#ffffff" stroke="#c9c9c4" stroke-width="1.2"/>
<circle cx="56.0" cy="358.0" r="15.0" fill="#A32D2D" stroke="#A32D2D" stroke-width="1.2"/>
<text x="56.0" y="358.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
<text x="82.0" y="358.0" font-size="13" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">"Tuned: 0.0000 MHz"</text>
<text x="50.0" y="384.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="112.0" y="384.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">rf_hz was tetra_freq + fine_hz, with fine_hz in kHz: 25 Hz instead of</text>
<text x="112.0" y="399.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">390.625 MHz.</text>
<rect x="44.0" y="414.0" width="482.0" height="32.0" rx="6" fill="#E7F6EC" stroke="#15803d" stroke-width="1.0"/>
<text x="56.0" y="430.0" font-size="10" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="86.0" y="430.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="start" dominant-baseline="central">rf_hz = tetra_freq + fine_hz × 1e3. Tuning check works again.</text>
<rect x="560.0" y="332.0" width="510.0" height="124.0" rx="10" fill="#ffffff" stroke="#c9c9c4" stroke-width="1.2"/>
<circle cx="586.0" cy="358.0" r="15.0" fill="#A32D2D" stroke="#A32D2D" stroke-width="1.2"/>
<text x="586.0" y="358.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text>
<text x="612.0" y="358.0" font-size="13" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">A ppm slider wired to nothing</text>
<text x="580.0" y="384.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="642.0" y="384.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">After switching to file playback, ppm and gain fed no block at all.</text>
<rect x="574.0" y="414.0" width="482.0" height="32.0" rx="6" fill="#E7F6EC" stroke="#15803d" stroke-width="1.0"/>
<text x="586.0" y="430.0" font-size="10" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="616.0" y="430.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="start" dominant-baseline="central">Back on the RTL-SDR source: ppm and gain go to the dongle.</text>
<rect x="30.0" y="472.0" width="510.0" height="124.0" rx="10" fill="#ffffff" stroke="#c9c9c4" stroke-width="1.2"/>
<circle cx="56.0" cy="498.0" r="15.0" fill="#A32D2D" stroke="#A32D2D" stroke-width="1.2"/>
<text x="56.0" y="498.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">7</text>
<text x="82.0" y="498.0" font-size="13" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Choppy audio</text>
<text x="50.0" y="524.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="112.0" y="524.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Every gap between 60 ms chunks was filled with silence straight away.</text>
<rect x="44.0" y="554.0" width="482.0" height="32.0" rx="6" fill="#E7F6EC" stroke="#15803d" stroke-width="1.0"/>
<text x="56.0" y="570.0" font-size="10" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="86.0" y="570.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="start" dominant-baseline="central">Start playing only once 180 ms is queued; re-buffer if it runs dry.</text>
<rect x="560.0" y="472.0" width="510.0" height="124.0" rx="10" fill="#ffffff" stroke="#c9c9c4" stroke-width="1.2"/>
<circle cx="586.0" cy="498.0" r="15.0" fill="#A32D2D" stroke="#A32D2D" stroke-width="1.2"/>
<text x="586.0" y="498.0" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">8</text>
<text x="612.0" y="498.0" font-size="13" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">A race on cell change</text>
<text x="580.0" y="524.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="642.0" y="524.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">The new cell key could reset the ETSI code while it was decoding a</text>
<text x="642.0" y="539.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">frame.</text>
<rect x="574.0" y="554.0" width="482.0" height="32.0" rx="6" fill="#E7F6EC" stroke="#15803d" stroke-width="1.0"/>
<text x="586.0" y="570.0" font-size="10" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="616.0" y="570.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="start" dominant-baseline="central">One lock around every call into the DLL.</text>
<text x="30.0" y="620.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central" font-style="italic">Items 1–4 came from reading the code; 3 was confirmed on a GNU Radio 3.10.9 install, 1–4 on test signals, and the whole fixed receiver on a live cell.</text>
</svg>
