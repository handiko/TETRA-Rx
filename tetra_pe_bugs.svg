<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" role="img" aria-label="The bug hunt: eight problems and their fixes">
<title>The bug hunt: eight problems and their fixes</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1b1b1b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#1b1b1b" stroke-width="1.4"/></marker><marker id="r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#a3312a"/></marker><marker id="or" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#a3312a" stroke-width="1.4"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9a9a9a" stroke-width="1.6"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="21" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Fig. 11  The bug hunt, in the order I found things</text>
<line x1="20.0" y1="62.0" x2="540.0" y2="62.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="20.0" y="92.0" font-size="30" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif">1</text>
<text x="60.0" y="92.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Voice decoder fed the wrong bursts</text>
<text x="60.0" y="122.0" font-size="14.5" fill="#666666" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="144.0" y="122.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">It listened to NTS2 (half slots = signalling).</text>
<text x="144.0" y="144.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Speech uses NTS1.</text>
<text x="60.0" y="182.0" font-size="14.5" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="144.0" y="182.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">A third correlator on NTS1, with its own cutter.</text>
<line x1="560.0" y1="62.0" x2="1080.0" y2="62.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="560.0" y="92.0" font-size="30" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif">2</text>
<text x="600.0" y="92.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Two cutters, one burst</text>
<text x="600.0" y="122.0" font-size="14.5" fill="#666666" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="684.0" y="122.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">The two halves came from two blocks in two</text>
<text x="684.0" y="144.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">threads and had to be paired.</text>
<text x="600.0" y="182.0" font-size="14.5" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="684.0" y="182.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">One Tags To PDU cuts all 484 bits; Python slices.</text>
<line x1="20.0" y1="226.0" x2="540.0" y2="226.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="20.0" y="256.0" font-size="30" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif">3</text>
<text x="60.0" y="256.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">The timeslot filter stopped the block</text>
<text x="60.0" y="286.0" font-size="14.5" fill="#666666" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="144.0" y="286.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">PMT objects have no .to_long():</text>
<text x="144.0" y="308.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">AttributeError on the very first burst.</text>
<text x="60.0" y="346.0" font-size="14.5" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="144.0" y="346.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">pmt.to_long(x), confirmed on GNU Radio 3.10.</text>
<line x1="560.0" y1="226.0" x2="1080.0" y2="226.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="560.0" y="256.0" font-size="30" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif">4</text>
<text x="600.0" y="256.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">There was no timeslot to filter on</text>
<text x="600.0" y="286.0" font-size="14.5" fill="#666666" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="684.0" y="286.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Nothing ever produced a "timeslot" value;</text>
<text x="684.0" y="308.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">the filter let everything through.</text>
<text x="600.0" y="346.0" font-size="14.5" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="684.0" y="346.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Bit positions from rx_time + a SYNC reference.</text>
<line x1="20.0" y1="390.0" x2="540.0" y2="390.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="20.0" y="420.0" font-size="30" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif">5</text>
<text x="60.0" y="420.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">"Tuned: 0.0000 MHz"</text>
<text x="60.0" y="450.0" font-size="14.5" fill="#666666" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="144.0" y="450.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">tetra_freq + fine_hz, with fine_hz in kHz:</text>
<text x="144.0" y="472.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">the panel thought I was tuned to 25 Hz.</text>
<text x="60.0" y="510.0" font-size="14.5" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="144.0" y="510.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">tetra_freq + fine_hz × 1e3.</text>
<line x1="560.0" y1="390.0" x2="1080.0" y2="390.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="560.0" y="420.0" font-size="30" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif">6</text>
<text x="600.0" y="420.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">A ppm slider wired to nothing</text>
<text x="600.0" y="450.0" font-size="14.5" fill="#666666" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="684.0" y="450.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">After switching to file playback, ppm and</text>
<text x="684.0" y="472.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">gain fed no block at all.</text>
<text x="600.0" y="510.0" font-size="14.5" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="684.0" y="510.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Back on the RTL-SDR source: both go to the dongle.</text>
<line x1="20.0" y1="554.0" x2="540.0" y2="554.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="20.0" y="584.0" font-size="30" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif">7</text>
<text x="60.0" y="584.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Choppy audio</text>
<text x="60.0" y="614.0" font-size="14.5" fill="#666666" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="144.0" y="614.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Every gap between 60 ms lumps was filled</text>
<text x="144.0" y="636.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">with silence straight away.</text>
<text x="60.0" y="674.0" font-size="14.5" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="144.0" y="674.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Play only once 180 ms is queued; re-buffer if dry.</text>
<line x1="560.0" y1="554.0" x2="1080.0" y2="554.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="560.0" y="584.0" font-size="30" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif">8</text>
<text x="600.0" y="584.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">A race on cell change</text>
<text x="600.0" y="614.0" font-size="14.5" fill="#666666" font-weight="700" text-anchor="start" dominant-baseline="central">Symptom</text>
<text x="684.0" y="614.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">A new cell key could reset the ETSI code</text>
<text x="684.0" y="636.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">while it was decoding a frame.</text>
<text x="600.0" y="674.0" font-size="14.5" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">Fix</text>
<text x="684.0" y="674.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">One lock around every call into the DLL.</text>
<line x1="20.0" y1="718.0" x2="1080.0" y2="718.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="20.0" y="735.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central" font-style="italic">Items 1–4 were found by reading and reasoning; 3 was confirmed on a GNU Radio 3.10.9 install, and 1, 2 and 4 by running the fixed graph on test signals.</text>
</svg>
