<text x="976.0" y="116.9" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">own 432-bit scrambler,</text>
<text x="976.0" y="135.7" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">same key</text>
<text x="280.0" y="224.0" font-size="22" fill="#a3312a" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">key = MCC ≪ 20  |  MNC ≪ 6  |  CC</text>
<text x="280.0" y="258.0" font-size="19" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">= 510 ≪ 20 | 1234 ≪ 6 | 60 = 0x1FE134BC</text>
<text x="280.0" y="292.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">chicken and egg: every channel except the BSCH</text>
<text x="280.0" y="312.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">is scrambled with this key</text>
