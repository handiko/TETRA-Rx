<text x="455.0" y="566.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central" font-style="italic">SCH/HD chain (Fig. 7)</text>
<text x="20.0" y="596.0" font-size="14.5" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">•  Before the first good SYNC, cell_key = 0: the SCH/HD chain decodes garbage and the CRC rejects it. That is normal.</text>
<text x="20.0" y="620.0" font-size="14.5" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">•  Two identical copies, because a 16-bit CRC on random correlator hits passes about once in 65,000.</text>
