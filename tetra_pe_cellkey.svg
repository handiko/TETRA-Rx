<text x="122.0" y="116.9" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">descrambled with key 0:</text>
<text x="122.0" y="135.7" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">anyone can read it</text>
