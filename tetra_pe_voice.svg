<text x="20.0" y="552.0" font-size="15" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">auto</text>
<text x="130.0" y="552.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">channel-decode every slot; score = good (non-BFI) frames in the last 2 s;</text>
<text x="20.0" y="578.0" font-size="15" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central"></text>
<text x="130.0" y="578.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">play the best slot once it has at least 6; a new choice resets the speech decoder</text>
<text x="20.0" y="604.0" font-size="15" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">TN1 … TN4</text>
<text x="130.0" y="604.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">play only that timeslot</text>
<text x="20.0" y="630.0" font-size="15" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">all</text>
<text x="130.0" y="630.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">old behaviour, mixes every slot: for debugging only</text>
<text x="20.0" y="676.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">What the console prints (every 200 bursts)</text>
<text x="20.0" y="706.0" font-size="14.5" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">[TCH/S] NTS1 bursts 200: TN1 0/0/0 TN2 0/0/0 TN3 183/183/178 TN4 0/0/0 (seen/good/played)</text>
<text x="20.0" y="732.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">seen = full-slot bursts on that timeslot;  good = the channel decoder’s CRC passed (no BFI);  played = sent to the speaker</text>
