<text x="766.0" y="656.0" font-size="14.0" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">message (PDU)</text>
<text x="20.0" y="772.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central" font-style="italic">Why a DLL: ACELP is a few thousand lines of fixed-point ETSI C. Rewritten in Python it would be slow and never bit-exact.</text>
