<text x="40.0" y="548.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">What gets cut out of each</text>
<text x="60.0" y="580.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">sync burst</text>
<text x="180.0" y="580.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">BSCH bits 94–213 (120) and block 2 bits 282–497 (216)</text>
<text x="1060.0" y="580.0" font-size="15" fill="#666666" font-weight="400" text-anchor="end" dominant-baseline="central">→ cell identity, then SYSINFO</text>
<text x="60.0" y="608.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">NTS2 burst</text>
<text x="180.0" y="608.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">block 1 bits 14–229 and block 2 bits 282–497, decoded separately</text>
<text x="1060.0" y="608.0" font-size="15" fill="#666666" font-weight="400" text-anchor="end" dominant-baseline="central">→ signalling</text>
<text x="60.0" y="636.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">NTS1 burst</text>
<text x="180.0" y="636.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">bits 14–497 in one piece (484); training in the middle dropped later</text>
<text x="1060.0" y="636.0" font-size="15" fill="#666666" font-weight="400" text-anchor="end" dominant-baseline="central">→ speech: 432 coded bits</text>
<text x="60.0" y="670.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central" font-style="italic">Both normal bursts put their training sequence in exactly the same place; only the 22-bit pattern tells them apart.</text>
