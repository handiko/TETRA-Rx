<text x="499.0" y="481.1" font-size="16.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Cell info</text>
<text x="499.0" y="500.9" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">TDMA ref: TN 1, FN 14</text>
<text x="499.0" y="519.7" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">starts at bit 357,176</text>
<text x="660.0" y="500.0" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">TN = (TN<tspan baseline-shift="sub" font-size="72%">ref</tspan> − 1 + k) mod 4 + 1</text>
<text x="660.0" y="528.0" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">FN steps every 4 slots, 1 … 18</text>
<rect x="182.0" y="298.0" width="734.0" height="110.0" fill="none" stroke="#666666" stroke-width="1.0" stroke-dasharray="5 4"/>
<text x="549.0" y="286.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central" font-style="italic">inside the TCH/S voice block</text>
<text x="20.0" y="580.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">(c) Two worked examples</text>
<text x="20.0" y="614.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">NTS1 tag at bit 358,462</text>
<text x="260.0" y="614.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">start 358,196: 1,020 bits after the reference, k = 2.00, error 0</text>
<text x="1080.0" y="614.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="end" dominant-baseline="central">→ TN 3, FN 14: decode it</text>
<text x="20.0" y="642.0" font-size="15" fill="#a3312a" font-weight="700" text-anchor="start" dominant-baseline="central">NTS1 "tag" at bit 358,900</text>
<text x="260.0" y="642.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">start 358,634: 1,458 bits after, k = 2.86 → 3, error −72</text>
<text x="1080.0" y="642.0" font-size="15" fill="#a3312a" font-weight="700" text-anchor="end" dominant-baseline="central">→ off the grid: dropped</text>
<text x="20.0" y="690.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">A real burst lands within a bit or two of the 510-bit grid. Random correlator hits land anywhere, so about 97 % of them fall off it.</text>
<text x="20.0" y="714.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">Frame 18 is skipped (no speech there). A reference older than 30 s is not trusted.</text>
