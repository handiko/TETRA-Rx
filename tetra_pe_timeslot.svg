<text x="499.0" y="350.0" font-size="19" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">(b − b<tspan baseline-shift="sub" font-size="72%">ref</tspan>) / 510</text>
