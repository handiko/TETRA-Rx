<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Timeslot tracking: absolute bit positions from Tags To PDU rx_time, anchored on a SYNC burst">
<title>Timeslot tracking: absolute bit positions from Tags To PDU rx_time, anchored on a SYNC burst</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="22.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Which timeslot is this burst? Counting bits from the last SYNC</text>
<rect x="60.0" y="80.0" width="125.0" height="46.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<text x="122.5" y="103.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="middle" dominant-baseline="central">TN1 FN14</text>
<text x="60.0" y="140.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">357,176</text>
<rect x="185.0" y="80.0" width="125.0" height="46.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<text x="247.5" y="103.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="middle" dominant-baseline="central">TN2 FN14</text>
<text x="185.0" y="140.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">357,686</text>
<rect x="310.0" y="80.0" width="125.0" height="46.0" rx="2" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.0"/>
<text x="372.5" y="103.0" font-size="11" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">TN3 FN14</text>
<text x="310.0" y="140.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">358,196</text>
<rect x="435.0" y="80.0" width="125.0" height="46.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<text x="497.5" y="103.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="middle" dominant-baseline="central">TN4 FN14</text>
<text x="435.0" y="140.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">358,706</text>
<rect x="560.0" y="80.0" width="125.0" height="46.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<text x="622.5" y="103.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="middle" dominant-baseline="central">TN1 FN15</text>
<text x="560.0" y="140.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">359,216</text>
<rect x="685.0" y="80.0" width="125.0" height="46.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<text x="747.5" y="103.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="middle" dominant-baseline="central">TN2 FN15</text>
<text x="685.0" y="140.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">359,726</text>
<rect x="810.0" y="80.0" width="125.0" height="46.0" rx="2" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.0"/>
<text x="872.5" y="103.0" font-size="11" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">TN3 FN15</text>
<text x="810.0" y="140.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">360,236</text>
<rect x="935.0" y="80.0" width="125.0" height="46.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<text x="997.5" y="103.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="middle" dominant-baseline="central">TN4 FN15</text>
<text x="935.0" y="140.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">360,746</text>
<text x="1060.0" y="140.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">slot start (bit)</text>
<text x="512.5" y="66.0" font-size="10" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">a call on TN3</text>
<polygon points="121.8,128.0 115.8,152.0 127.8,152.0" fill="#1d4ed8" fill-opacity="1.0" stroke="none"/>
<text x="121.8" y="164.0" font-size="10" fill="#1d4ed8" font-weight="700" text-anchor="middle" dominant-baseline="central">SYNC (y tag)</text>
<polygon points="375.2,128.0 369.2,152.0 381.2,152.0" fill="#15803d" fill-opacity="1.0" stroke="none"/>
<text x="375.2" y="164.0" font-size="10" fill="#15803d" font-weight="700" text-anchor="middle" dominant-baseline="central">NTS1 burst</text>
<polygon points="482.5,128.0 476.5,152.0 488.5,152.0" fill="#B91C1C" fill-opacity="1.0" stroke="none"/>
<text x="482.5" y="164.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="middle" dominant-baseline="central">false hit</text>
<rect x="30.0" y="200.0" width="330.0" height="120.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="195.0" y="229.0" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">① Every cut knows its bit number</text>
<text x="195.0" y="246.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">Tags To PDU stamps each piece with</text>
<text x="195.0" y="261.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">rx_time = tag offset ÷ 36,000 bit/s.</text>
<text x="195.0" y="276.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">rx_time × 36,000 = absolute bit number.</text>
<text x="195.0" y="291.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">All cutters share one pol_mul stream.</text>
<rect x="385.0" y="200.0" width="330.0" height="120.0" rx="8" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
<text x="550.0" y="229.0" font-size="13" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">② EPB 1 sends a TDMA reference</text>
<text x="550.0" y="246.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">After each CRC-good SYNC of my cell:</text>
<text x="550.0" y="261.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">TN 1, FN 14, MN 10,</text>
<text x="550.0" y="276.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">slot starts at bit 357,176</text>
<text x="550.0" y="291.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">(= y tag bit − 252)</text>
<rect x="740.0" y="200.0" width="330.0" height="120.0" rx="8" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
<text x="905.0" y="229.0" font-size="13" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">③ EPB 2 places each burst</text>
<text x="905.0" y="246.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">slot start = NTS1 tag bit − 266</text>
<text x="905.0" y="261.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">k = round((start − ref) ÷ 510)</text>
<text x="905.0" y="276.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">TN = (TN_ref − 1 + k) mod 4 + 1</text>
<text x="905.0" y="291.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">FN steps every 4 slots, 1 … 18</text>
<path d="M360.0 260.0 L383.0 260.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M715.0 260.0 L738.0 260.0" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahc)"/>
<text x="30.0" y="356.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Two worked examples</text>
<text x="30.0" y="384.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">NTS1 tag at bit 358,462</text>
<text x="225.0" y="384.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">start 358,196 · 1,020 bits after the reference · k = 2.00 · error 0 bits</text>
<text x="780.0" y="384.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">→ TN 3, FN 14: decode it</text>
<text x="30.0" y="412.0" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">NTS1 "tag" at bit 358,900</text>
<text x="225.0" y="412.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">start 358,634 · 1,458 bits after · k = 2.86 → 3 · error −72 bits</text>
<text x="780.0" y="412.0" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">→ off the slot grid: a correlator false hit, dropped</text>
<text x="30.0" y="456.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">• A real burst lands within a few bits of the 510-bit grid; I allow ±8. Random correlator hits land anywhere, so about 97 % of them are thrown out.</text>
<text x="30.0" y="477.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">• Bursts in frame 18 are skipped (no speech there). A reference older than 30 s is not trusted (the bit count could have slipped).</text>
<text x="30.0" y="498.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">• The decoded SYNC and its raw cut travel different paths into EPB 1, so it pairs them by sequence number: the BSCH chain is strictly</text>
<text x="30.0" y="519.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">   one PDU in, one PDU out, in order. The n-th raw cut belongs to the n-th decoded SYNC.</text>
<text x="30.0" y="560.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">Test signal: 183 of 183 placed on TN3.   Live cell, ~18 min: 14,802 full-slot bursts, none with an unknown timeslot, 0.6 % off-grid.</text>
</svg>
