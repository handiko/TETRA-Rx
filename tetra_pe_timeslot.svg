<polyline points="894.0,350.0 976.0,350.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="935.0" y="336.0" font-size="14" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">yes</text>
<text x="982.0" y="340.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">place it</text>
<text x="982.0" y="362.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">(TN, FN)</text>
<polyline points="836.0,388.0 836.0,436.0" fill="none" stroke="#a3312a" stroke-width="1.3" marker-end="url(#r)"/>
<text x="846.0" y="400.0" font-size="14" fill="#a3312a" font-weight="400" text-anchor="start" dominant-baseline="central">no</text>
