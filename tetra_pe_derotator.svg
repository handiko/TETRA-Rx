<polyline points="677.0,235.0 783.0,235.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="20.0" y="432.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">(b) Six stock blocks, feed-forward</text>
<text x="44.0" y="488.0" font-size="20" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">d[n]</text>
