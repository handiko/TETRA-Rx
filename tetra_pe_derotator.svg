<polyline points="214.0,580.0 248.0,580.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="250.0" y="556.0" width="130.0" height="48.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="315.0" y="580.0" font-size="19" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">−<tspan baseline-shift="super" font-size="72%">1</tspan>⁄<tspan baseline-shift="sub" font-size="72%">128</tspan> Σ</text>
<polyline points="380.0,580.0 424.0,580.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="426.0" y="556.0" width="84.0" height="48.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="468.0" y="580.0" font-size="20" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">arg(·)</text>
<polyline points="510.0,580.0 554.0,580.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="556.0" y="556.0" width="84.0" height="48.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="598.0" y="580.0" font-size="20" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">× −¼</text>
<polyline points="640.0,580.0 684.0,580.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="686.0" y="556.0" width="96.0" height="48.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="734.0" y="580.0" font-size="20" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">e<tspan baseline-shift="super" font-size="72%">jφ</tspan></text>
<polyline points="782.0,580.0 998.0,580.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="998.0,580.0 998.0,506.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<circle cx="998.0" cy="488.0" r="16.00" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<line x1="988.1" y1="478.1" x2="1007.9" y2="497.9" stroke="#1b1b1b" stroke-width="1.3"/>
<line x1="988.1" y1="497.9" x2="1007.9" y2="478.1" stroke="#1b1b1b" stroke-width="1.3"/>
<polyline points="1014.0,488.0 1076.0,488.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="1090.0" y="456.0" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="end" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">d[n] e<tspan baseline-shift="super" font-size="72%">−jθ</tspan></text>
<text x="900.0" y="472.0" font-size="14" fill="#666666" font-weight="400" text-anchor="end" dominant-baseline="central">every step, still rotated by θ</text>
<text x="532.0" y="562.0" font-size="16" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">4θ</text>
<text x="662.0" y="562.0" font-size="16" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">−θ</text>
<text x="177.0" y="620.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central" font-style="italic">Multiply</text>
<text x="315.0" y="620.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central" font-style="italic">Moving Average</text>
<text x="468.0" y="620.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central" font-style="italic">Complex to Arg</text>
<text x="598.0" y="620.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central" font-style="italic">Multiply Const</text>
<text x="734.0" y="620.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central" font-style="italic">Phase Mod</text>
<text x="1022.0" y="518.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central" font-style="italic">Multiply</text>
<text x="315.0" y="640.0" font-size="14" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">128 symbols ≈ 7 ms</text>
<text x="20.0" y="684.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Why not a Costas loop? A loop can lock a quarter-turn wrong and stay there. This has no memory and no lock state: it measures and corrects.</text>
<text x="20.0" y="708.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Its limit: the leftover must stay under ±45° per symbol (±2.25 kHz), which is the FLL’s job.</text>
</svg>
