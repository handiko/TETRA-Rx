<text x="618.0" y="144.9" font-size="20" fill="#a3312a" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">θ</text>
<text x="915.0" y="98.0" font-size="16.5" fill="#1b1b1b" font-weight="700" text-anchor="middle" dominant-baseline="central">Raised to the 4th power</text>
<line x1="797.0" y1="235.0" x2="1033.0" y2="235.0" stroke="#bdbdbd" stroke-width="1"/>
<line x1="915.0" y1="117.0" x2="915.0" y2="353.0" stroke="#bdbdbd" stroke-width="1"/>
<circle cx="915.0" cy="235.0" r="92.00" fill="none" stroke="#bdbdbd" stroke-width="1"/>
<text x="915.0" y="371.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">4 × (±45°, ±135°) = 180°: data gone,</text>
<text x="915.0" y="391.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">what is left is 4θ, the same for all</text>
<circle cx="823.0" cy="235.0" r="7.00" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<circle cx="823.0" cy="235.0" r="7.00" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
