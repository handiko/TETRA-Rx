<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 724" width="1100" height="724" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" role="img" aria-label="The 4th-power derotator: four phase steps, a leftover rotation, raise to the 4th power, six stock blocks">
<title>The 4th-power derotator: four phase steps, a leftover rotation, raise to the 4th power, six stock blocks</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1b1b1b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#1b1b1b" stroke-width="1.4"/></marker><marker id="r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#a3312a"/></marker><marker id="or" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#a3312a" stroke-width="1.4"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9a9a9a" stroke-width="1.6"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="21" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Fig. 5  The 4th-power trick: one rotation, four symbols, no loop</text>
<text x="20.0" y="64.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">(a) What the phase steps look like</text>
<text x="175.0" y="98.0" font-size="16.5" fill="#1b1b1b" font-weight="700" text-anchor="middle" dominant-baseline="central">The four steps (ideal)</text>
<line x1="57.0" y1="235.0" x2="293.0" y2="235.0" stroke="#bdbdbd" stroke-width="1"/>
<line x1="175.0" y1="117.0" x2="175.0" y2="353.0" stroke="#bdbdbd" stroke-width="1"/>
<circle cx="175.0" cy="235.0" r="92.00" fill="none" stroke="#bdbdbd" stroke-width="1"/>
<text x="175.0" y="371.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">each step turns the phase by one of</text>
<text x="175.0" y="391.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">these: two bits per symbol</text>
<circle cx="240.1" cy="169.9" r="7.00" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="254.1" y="153.9" font-size="14.5" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">+45° = 00</text>
<circle cx="109.9" cy="169.9" r="7.00" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="95.9" y="153.9" font-size="14.5" fill="#1b1b1b" font-weight="400" text-anchor="end" dominant-baseline="central">+135° = 01</text>
<circle cx="109.9" cy="300.1" r="7.00" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="95.9" y="316.1" font-size="14.5" fill="#1b1b1b" font-weight="400" text-anchor="end" dominant-baseline="central">−135° = 11</text>
<circle cx="240.1" cy="300.1" r="7.00" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="254.1" y="316.1" font-size="14.5" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">−45° = 10</text>
<text x="545.0" y="98.0" font-size="16.5" fill="#1b1b1b" font-weight="700" text-anchor="middle" dominant-baseline="central">With a leftover tuning error</text>
<line x1="427.0" y1="235.0" x2="663.0" y2="235.0" stroke="#bdbdbd" stroke-width="1"/>
<line x1="545.0" y1="117.0" x2="545.0" y2="353.0" stroke="#bdbdbd" stroke-width="1"/>
<circle cx="545.0" cy="235.0" r="92.00" fill="none" stroke="#bdbdbd" stroke-width="1"/>
<text x="545.0" y="371.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">every step turned by the same extra θ</text>
<text x="545.0" y="391.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">(here θ = 12°, about 600 Hz)</text>
<circle cx="610.1" cy="169.9" r="7.00" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
