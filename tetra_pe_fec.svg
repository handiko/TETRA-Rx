<text x="600.0" y="534.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">The coder makes 8 bits for every 2 data bits; the transmitter</text>
<text x="600.0" y="556.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">throws 5 away and sends 3 ("rate 2/3"). The empty seats get</text>
<text x="600.0" y="578.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">0.0, which to a soft Viterbi means "no idea".</text>
<text x="20.0" y="640.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">Why the CRC needs Python: TETRA’s CRC-16 covers 76 or 140 bits; the stock CRC blocks only work on whole bytes.</text>
<text x="20.0" y="664.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">The code’s state machine is written out as next-state and output tables in tetra_fec, so there is no generator-polynomial bit order to get wrong.</text>
