<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="TETRA control-channel decoding with stock blocks: descramble, de-interleave, de-puncture, Viterbi, CRC">
<title>TETRA control-channel decoding with stock blocks: descramble, de-interleave, de-puncture, Viterbi, CRC</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="22.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Undoing the transmitter's armour, one stock block per layer</text>
<rect x="30.0" y="60.0" width="180.0" height="80.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="120.0" y="84.0" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Multiply Const</text>
<text x="120.0" y="101.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">× ±1 scrambler</text>
<text x="120.0" y="116.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">(soft descramble)</text>
<rect x="244.0" y="60.0" width="180.0" height="80.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="334.0" y="84.0" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Trellis Permutation</text>
<text x="334.0" y="101.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">un-shuffle the</text>
<text x="334.0" y="116.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">block interleaver</text>
<path d="M212.0 100.0 L242.0 100.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="458.0" y="60.0" width="180.0" height="80.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="548.0" y="84.0" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Deinterleave 3 →</text>
<text x="548.0" y="101.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">Interleave 8</text>
<text x="548.0" y="116.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">+ Null Source</text>
<path d="M426.0 100.0 L456.0 100.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="672.0" y="60.0" width="180.0" height="80.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="762.0" y="84.0" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Viterbi Combo</text>
<text x="762.0" y="101.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">K = 5, rate 1/4</text>
<text x="762.0" y="116.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">mother code</text>
<path d="M640.0 100.0 L670.0 100.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="886.0" y="60.0" width="180.0" height="80.0" rx="8" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
<text x="976.0" y="84.0" font-size="13" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">EPB 1</text>
<text x="976.0" y="101.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">CRC-16 check</text>
<text x="976.0" y="116.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">then parse</text>
<path d="M854.0 100.0 L884.0 100.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="30.0" y="166.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">BSCH (SYNC)</text>
<text x="227.0" y="166.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">120 soft</text>
<text x="441.0" y="166.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">120 soft</text>
<text x="655.0" y="166.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">320 soft</text>
<text x="869.0" y="166.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">80 bits</text>
<text x="30.0" y="190.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">SCH/HD, BNCH</text>
<text x="227.0" y="190.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">216 soft</text>
<text x="441.0" y="190.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">216 soft</text>
<text x="655.0" y="190.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">576 soft</text>
<text x="869.0" y="190.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">144 bits</text>
<text x="976.0" y="166.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">60 + 16 CRC + 4 tail</text>
<text x="976.0" y="190.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">124 + 16 CRC + 4 tail</text>
<text x="1070.0" y="214.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">numbers between boxes = what flows on that arrow, per block</text>
<text x="30.0" y="254.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">De-puncturing, the part I liked most:</text>
<text x="30.0" y="276.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">The coder makes 8 bits for every 2 data bits, then the transmitter throws 5 away and sends 3 ("rate 2/3").</text>
<text x="30.0" y="296.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">I put the 3 received soft bits back in their seats and fill the 5 empty ones with 0.0, which to a soft Viterbi means "no idea".</text>
<rect x="60.0" y="318.0" width="56.0" height="40.0" rx="4" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="88.0" y="338.0" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="middle" dominant-baseline="central">rx 1</text>
<text x="88.0" y="370.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">mother 1</text>
<rect x="124.0" y="318.0" width="56.0" height="40.0" rx="4" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="152.0" y="338.0" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="middle" dominant-baseline="central">rx 2</text>
<text x="152.0" y="370.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">mother 2</text>
<rect x="188.0" y="318.0" width="56.0" height="40.0" rx="4" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.2"/>
<text x="216.0" y="338.0" font-size="11" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">0.0</text>
<text x="216.0" y="370.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">mother 3</text>
<rect x="252.0" y="318.0" width="56.0" height="40.0" rx="4" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.2"/>
<text x="280.0" y="338.0" font-size="11" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">0.0</text>
<text x="280.0" y="370.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">mother 4</text>
<rect x="316.0" y="318.0" width="56.0" height="40.0" rx="4" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="344.0" y="338.0" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="middle" dominant-baseline="central">rx 3</text>
<text x="344.0" y="370.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">mother 5</text>
<rect x="380.0" y="318.0" width="56.0" height="40.0" rx="4" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.2"/>
<text x="408.0" y="338.0" font-size="11" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">0.0</text>
<text x="408.0" y="370.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">mother 6</text>
<rect x="444.0" y="318.0" width="56.0" height="40.0" rx="4" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.2"/>
<text x="472.0" y="338.0" font-size="11" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">0.0</text>
<text x="472.0" y="370.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">mother 7</text>
<rect x="508.0" y="318.0" width="56.0" height="40.0" rx="4" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.2"/>
<text x="536.0" y="338.0" font-size="11" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">0.0</text>
<text x="536.0" y="370.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">mother 8</text>
<text x="592.0" y="330.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Deinterleave (3 outputs) splits the received bits,</text>
<text x="592.0" y="348.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Interleave (8 inputs) rebuilds the mother bits; inputs 2, 3, 5, 6, 7</text>
<text x="592.0" y="366.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">come from a Null Source. Two stock blocks, no Python.</text>
<text x="30.0" y="408.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">Why the CRC needs Python: TETRA's CRC-16 covers 76 or 140 bits. The stock CRC blocks only work on whole bytes.</text>
<text x="30.0" y="428.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">The FSM is written out as next-state / output tables in tetra_fec, so there is no generator-polynomial bit-order to get wrong.</text>
</svg>
