<polyline points="580.0,214.0 580.0,140.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="527.0" y="198.0" font-size="14" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">zeros + tag</text>
