<rect x="230.0" y="432.0" width="840.0" height="34.0" fill="#f0f0f0" stroke="#1b1b1b" stroke-width="1.1"/>
<text x="814.3" y="449.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">0 0 0 0 0 … data thrown away, only the tag kept</text>
