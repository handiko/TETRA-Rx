<text x="235.0" y="224.3" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">22 bits, ≤ 1 error</text>
<text x="235.0" y="260.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central" font-style="italic">Correlate Access Code - Tag</text>
