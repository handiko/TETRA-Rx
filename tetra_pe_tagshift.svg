<text x="612.0" y="152.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central" font-style="italic">Add</text>
<polyline points="596.0,122.0 700.0,122.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="648.0" y="92.0" font-size="14" fill="#a3312a" font-weight="400" text-anchor="middle" dominant-baseline="central">data, tag</text>
<text x="648.0" y="108.0" font-size="14" fill="#a3312a" font-weight="400" text-anchor="middle" dominant-baseline="central">now on bit 14</text>
<rect x="702.0" y="90.0" width="180.0" height="64.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="792.0" y="112.6" font-size="16.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Tags To PDU</text>
<text x="792.0" y="132.3" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">484 bits from the tag</text>
<polyline points="882.0,122.0 1000.0,122.0" fill="none" stroke="#1b1b1b" stroke-width="1.25" stroke-dasharray="6 4" marker-end="url(#o)"/>
<text x="1006.0" y="122.0" font-size="14" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">one full slot</text>
<text x="1006.0" y="140.0" font-size="14" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">(PDU)</text>
<text x="702.0" y="210.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Add keeps the tags from both inputs, and</text>
<text x="702.0" y="232.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">data + 0 = data. Nothing else changes.</text>
<text x="20.0" y="296.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">(b) What happens on the bit axis</text>
<text x="20.0" y="361.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">soft bits</text>
<text x="20.0" y="449.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">correlator × 0</text>
<text x="20.0" y="537.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">data delayed 252</text>
<text x="20.0" y="637.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">tag delayed 16</text>
