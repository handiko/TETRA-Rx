<rect x="404.0" y="96.0" width="70.0" height="52.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="439.0" y="122.0" font-size="20" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">z<tspan baseline-shift="super" font-size="72%">−252</tspan></text>
<text x="439.0" y="80.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central" font-style="italic">Delay</text>
