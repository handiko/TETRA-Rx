<polyline points="540.9,676.0 540.9,614.0" fill="none" stroke="#a3312a" stroke-width="2" marker-end="url(#r)"/>
<text x="550.9" y="606.0" font-size="14.5" fill="#a3312a" font-weight="400" text-anchor="start" dominant-baseline="central">tag moved to 282: block 2</text>
<polyline points="540.9,670.0 779.0,670.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="659.9" y="684.0" font-size="14.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">block 2: 216 bits</text>
<text x="230.0" y="712.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">0</text>
<text x="504.8" y="712.0" font-size="13" fill="#666666" font-weight="400" text-anchor="end" dominant-baseline="central">252</text>
<text x="523.2" y="728.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">266</text>
