<text x="779.0" y="712.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">498</text>
<text x="1070.0" y="712.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">762</text>
<text x="20.0" y="712.0" font-size="13" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">bit number →</text>
<text x="20.0" y="760.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">sync burst</text>
<text x="150.0" y="760.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">delay the data 158</text>
<text x="310.0" y="760.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">→ tag on the BSCH (bit 94)</text>
<text x="640.0" y="760.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">delay the tag 30</text>
<text x="790.0" y="760.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">→ tag on block 2 (bit 282)</text>
<text x="20.0" y="788.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">normal burst</text>
<text x="150.0" y="788.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">delay the data 252</text>
<text x="310.0" y="788.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">→ tag on block 1 / full slot (bit 14)</text>
<text x="640.0" y="788.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">delay the tag 16</text>
<text x="790.0" y="788.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">→ tag on block 2 (bit 282)</text>
<text x="20.0" y="838.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central" font-style="italic">All four numbers live in the tetra_fec module as differences of burst positions: Y_TAG = 214 + 38, P_TAG = 244 + 22.</text>
