<text x="371.0" y="184.0" font-size="14" fill="#a3312a" font-weight="400" text-anchor="middle" dominant-baseline="central">tag at</text>
<text x="371.0" y="200.0" font-size="14" fill="#a3312a" font-weight="400" text-anchor="middle" dominant-baseline="central">bit 266</text>
