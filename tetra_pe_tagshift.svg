<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" role="img" aria-label="The tag-shift trick: delay the data, not the tag">
<title>The tag-shift trick: delay the data, not the tag</title>
