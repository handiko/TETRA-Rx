<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" width="1100" height="590" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="The tag-shift trick: putting a correlator tag on the first bit of a block with Delay and Add">
<title>The tag-shift trick: putting a correlator tag on the first bit of a block with Delay and Add</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="22.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Moving a tag with stock blocks: delay the data, not the tag</text>
<text x="30.0" y="87.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">soft bits</text>
<text x="30.0" y="167.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">correlator, × 0</text>
<text x="30.0" y="247.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">data delayed 252</text>
<text x="30.0" y="367.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">tag delayed 16</text>
<rect x="140.0" y="70.0" width="17.1" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<rect x="157.1" y="70.0" width="263.5" height="34.0" rx="2" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="288.8" y="87.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">block 1</text>
<rect x="420.6" y="70.0" width="17.1" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<rect x="437.7" y="70.0" width="26.8" height="34.0" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.0"/>
<text x="451.1" y="87.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">NTS</text>
<rect x="464.5" y="70.0" width="19.5" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<rect x="484.0" y="70.0" width="263.5" height="34.0" rx="2" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="615.8" y="87.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">block 2</text>
<rect x="747.6" y="70.0" width="14.6" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<rect x="140.0" y="150.0" width="939.4" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<text x="260.0" y="167.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="start" dominant-baseline="central">0 0 0 0 0 0 0 … (data thrown away, only the tag kept)</text>
<path d="M464.5 142.0 L464.5 192.0" fill="none" stroke="#B91C1C" stroke-width="2.2"/>
<polygon points="464.5,136.0 458.5,146.0 470.5,146.0" fill="#B91C1C" fill-opacity="1.0" stroke="none"/>
<text x="472.5" y="140.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">tag at bit 266: training just ended</text>
<rect x="447.4" y="230.0" width="17.1" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<rect x="464.5" y="230.0" width="263.5" height="34.0" rx="2" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="596.3" y="247.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">block 1</text>
<rect x="728.0" y="230.0" width="17.1" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<rect x="745.1" y="230.0" width="26.8" height="34.0" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.0"/>
<text x="758.5" y="247.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">NTS</text>
<rect x="772.0" y="230.0" width="19.5" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<rect x="791.5" y="230.0" width="263.5" height="34.0" rx="2" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="923.2" y="247.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">block 2</text>
<rect x="1055.0" y="230.0" width="14.6" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<path d="M464.5 222.0 L464.5 272.0" fill="none" stroke="#B91C1C" stroke-width="2.2"/>
<polygon points="464.5,216.0 458.5,226.0 470.5,226.0" fill="#B91C1C" fill-opacity="1.0" stroke="none"/>
<text x="472.5" y="220.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">same tag, now on block 1</text>
<path d="M464.5 276.0 L1055.0 276.0" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
<text x="759.8" y="290.0" font-size="10" fill="#15803d" font-weight="700" text-anchor="middle" dominant-baseline="central">full slot: Tags To PDU takes 484 bits from the tag</text>
<path d="M464.5 300.0 L728.0 300.0" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ahb)" marker-start="url(#ahb)"/>
<text x="596.3" y="312.0" font-size="10" fill="#1d4ed8" font-weight="700" text-anchor="middle" dominant-baseline="central">or block 1 only: 216 bits</text>
<rect x="140.0" y="350.0" width="17.1" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<rect x="157.1" y="350.0" width="263.5" height="34.0" rx="2" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="288.8" y="367.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">block 1</text>
<rect x="420.6" y="350.0" width="17.1" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<rect x="437.7" y="350.0" width="26.8" height="34.0" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.0"/>
<text x="451.1" y="367.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">NTS</text>
<rect x="464.5" y="350.0" width="19.5" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<rect x="484.0" y="350.0" width="263.5" height="34.0" rx="2" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="615.8" y="367.0" font-size="10" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">block 2</text>
<rect x="747.6" y="350.0" width="14.6" height="34.0" rx="2" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.0"/>
<path d="M484.0 342.0 L484.0 392.0" fill="none" stroke="#B91C1C" stroke-width="2.2"/>
<polygon points="484.0,336.0 478.0,346.0 490.0,346.0" fill="#B91C1C" fill-opacity="1.0" stroke="none"/>
<text x="492.0" y="340.0" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">tag moved to 282: block 2</text>
<path d="M484.0 396.0 L747.6 396.0" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ahb)" marker-start="url(#ahb)"/>
<text x="615.8" y="408.0" font-size="10" fill="#1d4ed8" font-weight="700" text-anchor="middle" dominant-baseline="central">block 2: 216 bits</text>
<text x="140.0" y="430.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">0</text>
<text x="447.4" y="430.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">252</text>
<text x="484.0" y="430.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">282</text>
<text x="747.6" y="430.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">498</text>
<text x="1069.6" y="430.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">762</text>
<text x="464.5" y="442.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">266</text>
<text x="30.0" y="430.0" font-size="9" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">bit number →</text>
<text x="30.0" y="468.0" font-size="12" fill="#2b2b29" font-weight="600" text-anchor="start" dominant-baseline="central">Add (data + 0) keeps the tags from both inputs. Then Tags To PDU cuts a fixed number of bits starting at the tag.</text>
<text x="30.0" y="498.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">sync burst</text>
<text x="140.0" y="498.0" font-size="11" fill="#0F6E56" font-weight="700" text-anchor="start" dominant-baseline="central">delay the data 158</text>
<text x="290.0" y="498.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">→ tag sits on the BSCH (bit 94)</text>
<text x="620.0" y="498.0" font-size="11" fill="#0F6E56" font-weight="700" text-anchor="start" dominant-baseline="central">delay the tag 30</text>
<text x="750.0" y="498.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">→ tag sits on block 2 (bit 282)</text>
<text x="30.0" y="524.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">normal burst</text>
<text x="140.0" y="524.0" font-size="11" fill="#0F6E56" font-weight="700" text-anchor="start" dominant-baseline="central">delay the data 252</text>
<text x="290.0" y="524.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">→ tag sits on block 1 / full slot (bit 14)</text>
<text x="620.0" y="524.0" font-size="11" fill="#0F6E56" font-weight="700" text-anchor="start" dominant-baseline="central">delay the tag 16</text>
<text x="750.0" y="524.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">→ tag sits on block 2 (bit 282)</text>
<text x="30.0" y="560.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central" font-style="italic">All the numbers live in the tetra_fec module: Y_TAG = 214 + 38, P_TAG = 244 + 22, and the four delays are differences of those.</text>
</svg>
