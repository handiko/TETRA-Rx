<rect x="58.0" y="54.0" width="357.0" height="28.0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="60.0" y="68.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Hyperframe</text>
<text x="210.0" y="68.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">60 multiframes = 61.2 s</text>
<rect x="58.0" y="158.0" width="312.0" height="28.0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="60.0" y="172.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Multiframe</text>
<text x="210.0" y="172.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">18 frames = 1.02 s</text>
<rect x="58.0" y="280.0" width="348.0" height="28.0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="60.0" y="294.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Frame</text>
<text x="210.0" y="294.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">4 timeslots = 56.67 ms</text>
<rect x="58.0" y="402.0" width="447.0" height="28.0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="60.0" y="416.0" font-size="17" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Timeslot</text>
<text x="210.0" y="416.0" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">510 bits = 255 symbols = 14.17 ms</text>
<text x="60.0" y="528.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">•  The main carrier keeps TN 1 for the control channel (MCCH): SYNC, SYSINFO, signalling.</text>
<text x="60.0" y="554.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">•  A voice call gets one timeslot in every frame 1–17. Frame 18 never carries speech.</text>
<text x="60.0" y="580.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">•  Each traffic slot carries 60 ms of speech: 17 slots × 60 ms = 1.02 s, exactly one multiframe.</text>
<text x="60.0" y="606.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">•  So the decoder must know which timeslot and which frame number every burst belongs to.</text>
</svg>
