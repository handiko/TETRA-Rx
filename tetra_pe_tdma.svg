<text x="30.0" y="376.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Timeslot</text>
<text x="140.0" y="376.0" font-size="11" fill="#6b6b66" font-weight="600" text-anchor="start" dominant-baseline="central">510 bits = 255 symbols = 14.17 ms</text>
<rect x="60.0" y="390.0" width="980.0" height="40.0" rx="2" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.0"/>
<text x="550.0" y="410.0" font-size="12" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">one burst: training sequence in the middle, data either side (next picture)</text>
<text x="60.0" y="462.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">• The main carrier keeps TN 1 for the control channel (MCCH): SYNC, SYSINFO, signalling.</text>
<text x="60.0" y="484.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">• A voice call gets one timeslot in every frame 1–17. Frame 18 never carries speech.</text>
<text x="60.0" y="506.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">• Each traffic slot carries 60 ms of speech: 17 slots × 60 ms = 1.02 s, exactly one multiframe.</text>
<text x="60.0" y="528.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">• So my decoder must know which timeslot and which frame number every burst belongs to.</text>
</svg>
